<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Note - NoteTrack</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <style>
    .editor-card {
      max-width: 820px;
      margin: 0 auto;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      padding: 2.25rem;
    }
    .form-counters {
      display: flex;
      justify-content: flex-end;
      gap: 1.25rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <a href="dashboard.html" class="sidebar-brand">
          <img src="../assets/images/logo.svg" alt="NoteTrack" width="28" height="28">
          <span>NoteTrack</span>
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Menu</div>
        <a href="dashboard.html" class="nav-item">
          <i class="fa-solid fa-chart-pie"></i>
          <span>Dashboard</span>
        </a>
        <a href="notes.html" class="nav-item">
          <i class="fa-regular fa-note-sticky"></i>
          <span>My Notes</span>
        </a>
        <a href="create-note.html" class="nav-item active">
          <i class="fa-solid fa-plus"></i>
          <span>Create Note</span>
        </a>

        <div class="nav-section-title">Account</div>
        <a href="profile.html" class="nav-item">
          <i class="fa-regular fa-user"></i>
          <span>My Profile</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-quick-profile">
          <div class="user-avatar">U</div>
          <div class="user-details-mini">
            <div class="user-name-mini user-name-label">Loading...</div>
            <div class="user-role-mini">
              <span class="badge badge-primary user-role-badge">User</span>
            </div>
          </div>
          <button class="action-btn btn-logout-trigger" title="Log Out" style="color: #ef4444;">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="app-main">
      <!-- Topbar Header -->
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" aria-label="Toggle navigation">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="page-breadcrumb">
            <a href="dashboard.html">Home</a>
            <i class="fa-solid fa-chevron-right" style="font-size: 0.7rem;"></i>
            <a href="notes.html">Notes</a>
            <i class="fa-solid fa-chevron-right" style="font-size: 0.7rem;"></i>
            <span>Create Note</span>
          </div>
        </div>

        <div class="topbar-right">
          <button class="icon-action-btn theme-toggle-btn" onclick="UI.toggleTheme()" aria-label="Toggle theme">
            <i class="fa-solid fa-moon"></i>
          </button>

          <!-- Profile Dropdown -->
          <div class="profile-dropdown-wrapper">
            <button class="profile-trigger" data-dropdown-target="user-dropdown-menu" aria-label="User menu">
              <div class="user-avatar">U</div>
              <i class="fa-solid fa-chevron-down" style="font-size: 0.75rem; color: var(--text-muted);"></i>
            </button>
            <div class="dropdown-menu" id="user-dropdown-menu">
              <div class="dropdown-header">
                <div class="dropdown-user-name user-name-label">User</div>
                <div class="dropdown-user-email user-email-label">user@example.com</div>
              </div>
              <a href="profile.html" class="dropdown-item">
                <i class="fa-regular fa-user"></i> My Profile
              </a>
              <a href="notes.html" class="dropdown-item">
                <i class="fa-regular fa-note-sticky"></i> My Notes
              </a>
              <button class="dropdown-item text-danger btn-logout-trigger">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- Create Note Body -->
      <main class="page-content">
        <div class="page-header-row" style="max-width: 820px; margin-left: auto; margin-right: auto;">
          <div class="page-title-group">
            <h1>Create New Note</h1>
            <p>Capture thoughts, meeting takeaways, or documentation.</p>
          </div>
          <a href="notes.html" class="btn btn-secondary">
            <i class="fa-solid fa-arrow-left"></i> Back to Notes
          </a>
        </div>

        <div class="editor-card">
          <form id="create-note-form" novalidate>
            <div class="form-group">
              <label class="form-label" for="note-title">
                <span>Note Title</span>
                <span class="optional">(Required)</span>
              </label>
              <input type="text" id="note-title" class="form-control" placeholder="e.g., Q4 Engineering Objectives" required autofocus>
              <div class="form-counters">
                <span id="title-char-count">0 characters</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="note-description">
                <span>Note Content / Description</span>
                <span class="optional">(Required)</span>
              </label>
              <textarea id="note-description" class="form-control" style="min-height: 240px;" placeholder="Write your note content here..." required></textarea>
              <div class="form-counters">
                <span id="desc-word-count">0 words</span>
                <span id="desc-char-count">0 characters</span>
              </div>
            </div>

            <div class="d-flex align-center justify-between mt-3 flex-wrap gap-2">
              <button type="button" id="btn-discard" class="btn btn-secondary">
                <i class="fa-solid fa-trash-can"></i> Discard
              </button>
              <button type="submit" id="btn-submit-note" class="btn btn-primary btn-lg">
                <i class="fa-solid fa-cloud-arrow-up"></i> Save Note
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/notes.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!Auth.requireAuth()) return;

      const titleInput = document.getElementById('note-title');
      const descInput = document.getElementById('note-description');
      const titleCharCount = document.getElementById('title-char-count');
      const descWordCount = document.getElementById('desc-word-count');
      const descCharCount = document.getElementById('desc-char-count');
      const form = document.getElementById('create-note-form');
      const submitBtn = document.getElementById('btn-submit-note');
      const discardBtn = document.getElementById('btn-discard');

      // Live counters
      titleInput.addEventListener('input', () => {
        titleCharCount.textContent = `${titleInput.value.length} characters`;
      });

      descInput.addEventListener('input', () => {
        const text = descInput.value.trim();
        const words = text ? text.split(/\s+/).length : 0;
        descWordCount.textContent = `${words} words`;
        descCharCount.textContent = `${descInput.value.length} characters`;
      });

      // Discard button
      discardBtn.addEventListener('click', () => {
        if (titleInput.value || descInput.value) {
          UI.showModal({
            title: 'Discard Note?',
            content: '<p>You have unsaved changes. Are you sure you want to discard this note?</p>',
            confirmText: 'Discard',
            confirmClass: 'btn-danger',
            onConfirm: () => {
              window.location.href = 'notes.html';
            }
          });
        } else {
          window.location.href = 'notes.html';
        }
      });

      // Submit
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const title = titleInput.value.trim();
        const description = descInput.value.trim();

        if (!title) {
          UI.showToast('Please enter a note title.', 'error');
          titleInput.focus();
          return;
        }

        if (!description) {
          UI.showToast('Please enter note description content.', 'error');
          descInput.focus();
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Saving Note...';

        try {
          const created = await Notes.createNote(title, description);
          UI.showToast('Note created successfully!', 'success');
          setTimeout(() => {
            window.location.href = `note-details.html?id=${created.id}`;
          }, 800);
        } catch (error) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Save Note';
          UI.showToast(error.message, 'error', 'Creation Failed');
        }
      });
    });
  </script>
</body>
</html>
